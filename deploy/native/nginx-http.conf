server {
    listen 80;
    server_name osce.bintangputra.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/osce/acme;
    }
    location / {
        return 503 "OSCE is being deployed. Please try again shortly.";
        add_header Content-Type text/plain;
        add_header Retry-After 120;
    }
}
