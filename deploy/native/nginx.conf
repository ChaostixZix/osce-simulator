server {
    listen 80;
    server_name osce.bintangputra.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/osce/acme;
    }
    location / {
        return 301 https://osce.bintangputra.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name osce.bintangputra.dev;
    ssl_certificate /etc/osce/letsencrypt/live/osce.bintangputra.dev/fullchain.pem;
    ssl_certificate_key /etc/osce/letsencrypt/live/osce.bintangputra.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OSCE:1m;
    server_tokens off;

    root /var/lib/osce/public;
    index index.php;
    charset utf-8;
    client_max_body_size 1m;
    access_log /var/log/nginx/osce-access.log;
    error_log /var/log/nginx/osce-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:19086;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/babu-out/osce-simulator-fix-20261024/repo/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST osce.bintangputra.dev;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~* ^/(build|fonts)/ {
        expires 7d;
        try_files $uri =404;
    }
}
